# Publishes packages/cleanprospecter to its read-only repository SO-LEAN/cleanprospecter,
# which is the one registered on Packagist.
# Requires the SPLIT_ACCESS_TOKEN secret: a token with write access to SO-LEAN/cleanprospecter.
name: Split packages

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split cleanprospecter (branch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_ACCESS_TOKEN }}
        with:
          package_directory: packages/cleanprospecter
          repository_organization: SO-LEAN
          repository_name: cleanprospecter
          branch: main
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Split cleanprospecter (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_ACCESS_TOKEN }}
        with:
          package_directory: packages/cleanprospecter
          repository_organization: SO-LEAN
          repository_name: cleanprospecter
          branch: main
          tag: ${{ github.ref_name }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
