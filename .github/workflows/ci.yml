# Continuous integration (ADR 0057, 0109, 0110): what make ci runs locally, in Docker as locally, on the pull requests
# to dev and main, which cannot be merged while it fails, and on the pushes of dev and main. A pull request runs the
# checks its changes need, a push every one; each check runs in a job of its own, together, its lint and its tests
# together too (make -j); the job ci sums them up, the check the rulesets require. The journeys are no check of the CI:
# the agent runs them in its worktree, make ci running them there (ADR 0118).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: List the checks the changes need
        id: checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then checks=$(make changed-checks RANGE="origin/$BASE_REF...HEAD" | jq -c 'map(select(. != "e2e"))'); else checks='["secrets","infra","core","api","storage","front","contract"]'; fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "$checks"

  check:
    needs: changes
    name: check ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.changes.outputs.checks) }}
    env:
      PHP: ${{ contains(fromJSON('["core","api","storage","contract"]'), matrix.check) }}
      NODE: ${{ contains(fromJSON('["front","contract"]'), matrix.check) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # make secrets-branch scans the commits since dev
          fetch-depth: ${{ matrix.check == 'secrets' && 0 || 1 }}

      - name: Cache the Composer dependencies
        if: env.PHP == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/api/vendor
            apps/storage/vendor
            packages/core/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock', 'apps/storage/composer.lock', 'packages/core/composer.lock') }}

      - name: Cache the pnpm dependencies
        if: env.NODE == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: apps/front/node_modules
          key: pnpm-${{ hashFiles('apps/front/pnpm-lock.yaml') }}

      - name: Install the Composer dependencies
        if: env.PHP == 'true'
        run: make vendor

      - name: Install the pnpm dependencies
        if: env.NODE == 'true'
        run: make front-install

      - name: Check ${{ matrix.check }}
        run: make -j --output-sync=recurse check-${{ matrix.check }}
        env:
          # tflint downloads its AWS ruleset from GitHub, beyond the anonymous rate limit of the shared runners
          GITHUB_TOKEN: ${{ matrix.check == 'infra' && github.token || '' }}

  ci:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every check needed passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.check.result }}
        run: test "$CHANGES" = success -a "$CHECKS" = success
