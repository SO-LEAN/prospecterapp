# Continuous integration (ADR 0057, 0109, 0110): what make ci runs locally, in Docker as locally, on the pull requests
# to dev and main, which cannot be merged while it fails, and on the pushes of dev and main. A pull request runs the
# checks its changes need, a push every one; each check runs in a job of its own, together, its lint and its tests
# together too (make -j), their output not synchronised, so that the progress of the tests shows while they run (make
# keeps the output of a command until it ends with any --output-sync, ADR 0180); the job ci sums them up, the check
# the rulesets require. A pull request also mutates the lines it adds, in a job per part of the code it touches, beside
# the checks; their reports go in artifacts for the definition of done, which judges the threshold (ADR 0219). dev's
# merge queue runs the checks once more, on the pull request rebased onto dev and onto those queued before it, and the
# journeys there only, in the job e2e, when the changes need them (ADR 0220): a push to a pull request, to dev or to
# main runs none. The merge queue mutates nothing.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      mutations: ${{ steps.checks.outputs.mutations }}
      e2e: ${{ steps.checks.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # A pull request runs the checks for its changes since its base, and mutates the lines it adds. The merge queue
      # runs the checks for its group's changes since the dev it starts from, the journeys among them. A push runs every
      # check. Only the merge queue runs the journeys, and only a pull request mutates
      - name: List the checks the changes need
        id: checks
        env:
          BASE_REF: ${{ github.base_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE_REF" ]; then changed=$(make changed-checks RANGE="origin/$BASE_REF...HEAD")
          elif [ -n "$QUEUE_BASE" ]; then changed=$(make changed-checks RANGE="$QUEUE_BASE...HEAD" | jq -c 'map(select(startswith("mutation-") | not))')
          else changed='["secrets","infra","core","api","storage","front","contract","event-storming"]'; fi
          checks=$(echo "$changed" | jq -c 'map(select(. != "e2e" and (startswith("mutation-") | not)))')
          mutations=$(echo "$changed" | jq -c 'map(select(startswith("mutation-")) | ltrimstr("mutation-"))')
          e2e=$(echo "$changed" | jq 'index("e2e") != null')
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "mutations=$mutations" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "checks: $checks, mutations: $mutations, journeys: $e2e"

  check:
    needs: changes
    name: check ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.changes.outputs.checks) }}
    env:
      PHP: ${{ contains(fromJSON('["core","api","storage","contract","event-storming"]'), matrix.check) }}
      NODE: ${{ contains(fromJSON('["front","contract","event-storming"]'), matrix.check) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # make secrets-branch scans the commits since dev, make commit-subjects those in neither dev nor main. The
          # number 0 is falsy in an expression: the depths are strings
          fetch-depth: ${{ matrix.check == 'secrets' && '0' || '1' }}

      - name: Cache the Composer dependencies
        if: env.PHP == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/api/vendor
            apps/storage/vendor
            packages/core/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock', 'apps/storage/composer.lock', 'packages/core/composer.lock') }}

      - name: Cache the pnpm dependencies
        if: env.NODE == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: apps/front/node_modules
          key: pnpm-${{ hashFiles('apps/front/pnpm-lock.yaml') }}

      - name: Install the Composer dependencies
        if: env.PHP == 'true'
        run: make vendor

      - name: Install the pnpm dependencies
        if: env.NODE == 'true'
        run: make front-install

      - name: Check ${{ matrix.check }}
        run: make -j check-${{ matrix.check }}
        env:
          # a push runs every test, the API tests re-testing a core rule too (the core-rule group)
          ALL: ${{ github.event_name == 'push' && '1' || '' }}
          # tflint downloads its AWS ruleset from GitHub, beyond the anonymous rate limit of the shared runners
          GITHUB_TOKEN: ${{ matrix.check == 'infra' && github.token || '' }}

  # the parts whose code a pull request adds lines to, mutated from its base (the merge-base of dev and its merge
  # commit), as make mutation BASE= does. A skipped mutant of the core fails the job, as it fails make mutation; a
  # score under the threshold does not. The job is not part of the check ci: the definition of done reads its artifact
  mutation:
    needs: changes
    if: needs.changes.outputs.mutations != '[]'
    name: mutation ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.mutations) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the merge-base with dev, from which the added lines are read
          fetch-depth: 0

      - name: Cache the Composer dependencies
        if: matrix.part == 'core'
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/api/vendor
            apps/storage/vendor
            packages/core/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock', 'apps/storage/composer.lock', 'packages/core/composer.lock') }}

      - name: Cache the pnpm dependencies
        if: matrix.part != 'core'
        uses: actions/cache@v6.1.0
        with:
          path: apps/front/node_modules
          key: pnpm-${{ hashFiles('apps/front/pnpm-lock.yaml') }}

      - name: Install the Composer dependencies
        if: matrix.part == 'core'
        run: make vendor

      - name: Install the pnpm dependencies
        if: matrix.part != 'core'
        run: make front-install

      - name: Mutate the lines the pull request adds
        env:
          PART: ${{ matrix.part }}
          BASE_REF: ${{ github.base_ref }}
        run: make "mutation-$PART" BASE="origin/$BASE_REF"

      - name: Sum up the mutation
        if: always()
        env:
          PART: ${{ matrix.part }}
        run: |
          make mutation-artifact PART="$PART" DIR=mutation
          cat mutation/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-${{ matrix.part }}
          path: mutation/
          if-no-files-found: error

  # Only the merge queue runs the journeys, on the code that reaches dev (ADR 0220). make check-e2e starts the stack on
  # the runner, deploys it and gives it the demonstration. A group whose changes need none passes at once, so that the
  # check the queue requires does not hold it. A failure keeps Playwright's report and the stack's logs
  e2e:
    if: github.event_name == 'merge_group'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEEDED: ${{ needs.changes.outputs.e2e }}
    steps:
      - name: No journey needed
        if: env.NEEDED != 'true'
        run: echo "No change of this group is one the journeys cover (make changed-checks)"

      - uses: actions/checkout@v7.0.1
        if: env.NEEDED == 'true'

      - name: Cache the Composer dependencies
        if: env.NEEDED == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/api/vendor
            apps/storage/vendor
            packages/core/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock', 'apps/storage/composer.lock', 'packages/core/composer.lock') }}

      - name: Cache the pnpm dependencies
        if: env.NEEDED == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: apps/front/node_modules
          key: pnpm-${{ hashFiles('apps/front/pnpm-lock.yaml') }}

      - name: Install the dependencies
        if: env.NEEDED == 'true'
        run: make vendor front-install

      - name: Run the journeys
        if: env.NEEDED == 'true'
        run: make check-e2e

      - name: Keep the logs of the stack
        if: failure() && env.NEEDED == 'true'
        run: make logs-save E2E_LOGS=e2e-logs

      - name: Keep the report of the journeys
        if: failure() && env.NEEDED == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-report
          path: |
            apps/front/playwright-report
            apps/front/test-results
          retention-days: 7

      - name: Keep the logs
        if: failure() && env.NEEDED == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 7

  ci:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every check needed passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.check.result }}
        run: test "$CHANGES" = success -a "$CHECKS" = success
