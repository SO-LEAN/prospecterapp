# Terraform plans every pull request touching the infrastructure (ADR 0060): each changed app on each instance, with
# a read-only role of the account of the instance. The repository is public, its logs too: the account ids and the
# state bucket are masked, and the comment lists the changed resources, never their values.
name: Terraform plan

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/*/infra/**'
      - '.terraform-version'
      - 'Makefile'
      - '.github/workflows/terraform-plan.yml'

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apps:
    # A pull request from a fork gets neither the secrets nor an OIDC token
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: List the apps whose infrastructure changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$changed" | grep -qE '^(\.terraform-version|Makefile|\.github/workflows/terraform-plan\.yml)$'; then
            apps=$(printf '%s\n' apps/*/infra | cut -d/ -f2)
          else
            apps=$(echo "$changed" | sed -nE 's|^apps/([a-z]+)/infra/.*|\1|p' | sort -u)
          fi
          echo "apps=$(echo "$apps" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  plan:
    needs: apps
    if: needs.apps.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
        instance: ${{ fromJSON(vars.INFRA_PLAN_INSTANCES || '["dev", "prod"]') }}
    env:
      APP: ${{ matrix.app }}
      INSTANCE: ${{ matrix.instance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the values of the instance
        id: values
        env:
          TFVARS: ${{ secrets[format('INFRA_TFVARS_{0}', matrix.instance)] }}
          TFBACKEND: ${{ secrets[format('INFRA_TFBACKEND_{0}', matrix.instance)] }}
        run: |
          if [ -z "$TFVARS" ] || [ -z "$TFBACKEND" ]; then
            echo "::error::The secrets INFRA_TFVARS_${INSTANCE^^} and INFRA_TFBACKEND_${INSTANCE^^} are missing (docs/infra.md)"
            exit 1
          fi
          for value in $(printf '%s\n%s\n' "$TFVARS" "$TFBACKEND" | grep -oE '[0-9]{12}' | sort -u) \
                       $(echo "$TFBACKEND" | sed -nE 's/^bucket *= *"(.*)"/\1/p'); do
            echo "::add-mask::$value"
          done
          mkdir -p "$RUNNER_TEMP/infra/envs"
          printf '%s\n' "$TFVARS" > "$RUNNER_TEMP/infra/envs/$INSTANCE.tfvars"
          printf '%s\n' "$TFBACKEND" > "$RUNNER_TEMP/infra/envs/$INSTANCE.tfbackend"
          # Names only: docker passes on the temporary credentials from the environment, none is written to disk
          printf '%s\n' AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION > "$RUNNER_TEMP/infra/envs/$INSTANCE.env"
          echo "region=$(echo "$TFBACKEND" | sed -nE 's/^region *= *"(.*)"/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Assume the plan role of the account
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets[format('AWS_PLAN_ROLE_ARN_{0}', matrix.instance)] }}
          aws-region: ${{ steps.values.outputs.region }}
          mask-aws-account-id: true

      - name: Plan
        id: plan
        run: make infra-plan APP="$APP" INSTANCE="$INSTANCE" INFRA_CONFIG="$RUNNER_TEMP/infra" INFRA_PLAN_FLAGS="-lock=false -no-color" 2>&1 | tee plan.txt

      - name: Comment the changed resources
        if: always() && steps.values.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { APP, INSTANCE } = process.env;
            const marker = `<!-- terraform-plan ${APP} ${INSTANCE} -->`;
            const log = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : '';
            const summary = (log.match(/^(Plan: .*|No changes\..*)$/m) || ['**The plan failed**: see the log.'])[0];
            const resources = log.split('\n')
              .map((line) => line.match(/^\s+# (.+?) ((?:will|must) be .*)$/))
              .filter(Boolean)
              .map(([, address, action]) => `- \`${address}\` ${action}`);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan · \`${APP}\` · \`${INSTANCE}\``,
              summary,
              resources.length ? `<details><summary>${resources.length} resources</summary>\n\n${resources.slice(0, 200).join('\n')}\n</details>` : '',
              `[The whole plan in the log](${run}), values masked.`,
            ].join('\n\n');
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find((comment) => comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...issue, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
