parameters:
    google_api_url: 'https://maps.googleapis.com/maps/api/geocode/json'
    knp_menu.renderer.twig.options:
        currentClass: 'active'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Solean\CleanProspecter\UseCase\AbstractUseCase:
            tags: ['use_case']
            lazy: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Presenter/'
            - '../src/Service/Image/UrlImageInfo.php'
            - '../src/Service/RequestHandler/'

    # Use cases (clean architecture library)
    Solean\CleanProspecter\UseCase\UseCasesFacade: ~
    Solean\CleanProspecter\UseCase\:
        resource: '../vendor/so-lean/cleanprospecter/src/CleanProspecter/UseCase/*/*Impl.php'

    # Gateways: library interfaces implemented by the application
    Solean\CleanProspecter\Gateway\Entity\UserGateway: '@App\Gateway\Entity\UserRepositoryAdapter'
    Solean\CleanProspecter\Gateway\Entity\OrganizationGateway: '@App\Gateway\Entity\OrganizationRepositoryAdapter'
    Solean\CleanProspecter\Gateway\Entity\Transaction: '@App\Gateway\Entity\TransactionEntityManagerAdapter'
    Solean\CleanProspecter\Gateway\Storage: '@App\Gateway\StorageLocalAdapter'
    Solean\CleanProspecter\Gateway\UserNotifier: '@App\Gateway\UserNotifierSymfonyAdapter'
    Solean\CleanProspecter\Gateway\GeoLocation: '@App\Gateway\GeoLocatorAdapter'

    App\Gateway\Entity\UserRepositoryAdapter:
        lazy: true
        arguments:
            $entityClass: 'Solean\CleanProspecter\Entity\User'
    App\Gateway\Entity\OrganizationRepositoryAdapter:
        lazy: true
        arguments:
            $entityClass: 'Solean\CleanProspecter\Entity\Organization'

    # Controllers do not depend on the container: their collaborators are injected by setters
    App\Controller\Web\:
        resource: '../src/Controller/Web/'
        exclude: '../src/Controller/Web/SecurityController.php'
        tags: ['controller.service_arguments']
        calls:
            - [setPresenterFactory, ['@App\Service\PresenterFactory']]
            - [setFormFactory, ['@form.factory']]
            - [setTwig, ['@twig']]
            - [setRouter, ['@router']]
            - [setUseCases, ['@Solean\CleanProspecter\UseCase\UseCasesFacade']]
            - [setFormHandler, ['@App\Service\RequestHandler']]

    # Security
    App\Security\ProspecterAuthenticator:
        arguments:
            $loginRoute: 'login'
            $defaultSuccessRedirectRoute: 'dashboard_display'

    # Menu
    App\Menu\MenuBuilder:
        tags:
            - { name: 'knp_menu.menu_builder', method: 'createMainMenu', alias: 'main' }
            - { name: 'knp_menu.menu_builder', method: 'createLeftMenu', alias: 'left' }
            - { name: 'knp_menu.menu_builder', method: 'createRightMenu', alias: 'right' }
            - { name: 'knp_menu.menu_builder', method: 'createBreadcrumb', alias: 'breadcrumb' }

    # Services
    App\Service\LocalStorageService:
        arguments:
            $path: '%env(resolve:APP_STORAGE_PATH)%'
            $url: '%env(APP_STORAGE_URL)%'
    App\Service\Image\SecretCipherHandler:
        arguments:
            $secret: '%env(APP_SECRET)%'
    App\Service\GeoLocator: '@App\Service\GoogleMapGeoLocator'
    App\Service\GoogleMapGeoLocator:
        arguments:
            $apiUrl: '%google_api_url%'
            $apiKey: '%env(APP_GOOGLE_API_KEY)%'

    # Form handling commands, selected by RequestHandler from the route suffix
    App\Service\RequestHandler\AbstractFormHandlingCommand:
        abstract: true
        calls:
            - [setFormFactory, ['@form.factory']]
            - [setTwig, ['@twig']]
            - [setRouter, ['@router']]
            - [setUseCases, ['@Solean\CleanProspecter\UseCase\UseCasesFacade']]
    App\Service\RequestHandler\CreateFormHandlingCommand:
        parent: App\Service\RequestHandler\AbstractFormHandlingCommand
        autowire: false
        autoconfigure: false
        lazy: true
        tags: [{ name: 'form_cmd', id: 'create' }]
    App\Service\RequestHandler\UpdateFormHandlingCommand:
        parent: App\Service\RequestHandler\AbstractFormHandlingCommand
        autowire: false
        autoconfigure: false
        lazy: true
        tags: [{ name: 'form_cmd', id: 'update' }]
