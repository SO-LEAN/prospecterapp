# The bucket of the private files in MiniStack (ADR 0077), included by the locations of the static host passing it the
# requests the storage signed for the browsers: the host kept, which the signature covers. The CORS are those of nginx,
# on the refusals too (a file too heavy for its form).
proxy_set_header Host $host;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header x-amz-request-id;
proxy_hide_header x-amz-id-2;
proxy_hide_header x-amzn-requestid;
add_header Access-Control-Allow-Origin * always;
proxy_pass http://$ministack;
