# The front controller of the authorization server (apps/auth), for the paths the API host gives it.
fastcgi_pass php:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/src/apps/auth/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/src/apps/auth/public;
