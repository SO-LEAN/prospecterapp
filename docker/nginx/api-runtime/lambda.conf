# The API in its Lambda behind the HTTP API of MiniStack (make lambda, ADR 0053), addressed by path: the host of
# the request is kept for the routes of the API, the gateway telling the API it was https
location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 60s;
    proxy_pass http://$ministack/_aws/execute-api/prospecter-dev-api/local$request_uri;
}
