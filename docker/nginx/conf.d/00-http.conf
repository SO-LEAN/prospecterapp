server_tokens off;
client_max_body_size 20m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
