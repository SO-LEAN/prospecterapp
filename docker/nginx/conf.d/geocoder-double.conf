# The double of the geocoder of the IGN for the journeys (make e2e): the API in its Lambda asks it at
# http://nginx:8081/search, on the Docker network only, while the journeys run. It answers as the service does: a known
# place at a fixed position, any other address no feature, so that a journey gives the same result each time.
map $arg_q $known_place {
    default "";
    ~*strasbourg "7.7456,48.5834";
    ~*colmar "7.3585,48.0794";
}

server {
    listen 8081;
    server_name _;
    access_log off;
    default_type application/json;

    location = /search {
        if ($known_place = "") {
            return 200 '{"type":"FeatureCollection","features":[]}';
        }
        return 200 '{"type":"FeatureCollection","features":[{"type":"Feature","geometry":{"type":"Point","coordinates":[$known_place]},"properties":{"score":1}}]}';
    }

    location / {
        return 404;
    }
}
