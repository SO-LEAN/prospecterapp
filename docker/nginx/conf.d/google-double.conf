# The double of the OAuth 2 endpoints of Google (ADR 0120): the API of the local stack asks it at http://nginx:8082, on
# the Docker network only, unless apps/api/.env.local names the addresses of Google, for any client an account
# configured (the demonstration's is client-of-the-double, ADR 0125). Its token endpoint grants every code and
# every refresh the same tokens, an identity token of the account agenda@solean-it.io with the scopes Prospecter asks,
# and its revocation revokes nothing. Its authorization page is on the host of the API (templates/api.conf.template),
# for the browser.
server {
    listen 8082;
    server_name _;
    access_log off;
    default_type application/json;

    location = /token {
        return 200 '{"access_token":"access-token-of-the-double","expires_in":3599,"token_type":"Bearer","refresh_token":"refresh-token-of-the-double","scope":"openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/calendar.app.created","id_token":"eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20iLCJlbWFpbCI6ImFnZW5kYUBzb2xlYW4taXQuaW8iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwiaGQiOiJzb2xlYW4taXQuaW8ifQ.double"}';
    }

    location = /revoke {
        return 200 '{}';
    }

    location / {
        return 404;
    }
}
