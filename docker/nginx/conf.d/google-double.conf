# The double of the OAuth 2 endpoints and of the calendar of Google (ADR 0120, 0127): the API of the local stack asks
# it at http://nginx:8082, on the Docker network only, unless apps/api/.env.local names the addresses of Google, for
# any client an account configured (the demonstration's is client-of-the-double, ADR 0125). Its token endpoint grants
# every code and every refresh the same tokens, an identity token of the account agenda@solean-it.io with the scopes
# Prospecter asks, its revocation revokes nothing, and its calendar takes every push and every withdrawal, keeping
# nothing, answering one Meet link to every event asking a conference. Its authorization page is on the host of the API (templates/api.conf.template), for the browser. It
# answers 503 to every call once make google-down asked it to, as Google out of reach, again once make google-up.
server {
    listen 8082;
    server_name _;
    access_log off;
    default_type application/json;

    # Google out of reach while make google-down left its flag, until make google-up removes it
    if (-f /tmp/google-down) {
        return 503;
    }

    location = /token {
        return 200 '{"access_token":"access-token-of-the-double","expires_in":3599,"token_type":"Bearer","refresh_token":"refresh-token-of-the-double","scope":"openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/calendar.app.created","id_token":"eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20iLCJlbWFpbCI6ImFnZW5kYUBzb2xlYW4taXQuaW8iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwiaGQiOiJzb2xlYW4taXQuaW8ifQ.double"}';
    }

    location = /revoke {
        return 200 '{}';
    }

    # the calendar « Prospecter » of the member (ADR 0127): created, then every event put or removed as asked
    location = /calendar/v3/calendars {
        return 200 '{"id":"calendar-of-the-double"}';
    }

    # an event asking a Meet conference answers its link at once, the same for every event (ADR 0137)
    location /calendar/v3/calendars/ {
        if ($arg_conferenceDataVersion = "1") {
            return 200 '{"hangoutLink":"https://meet.google.com/double-of-prospecter"}';
        }
        return 200 '{}';
    }

    location / {
        return 404;
    }
}
