# The storage app in its Lambda behind its HTTP API on MiniStack (make lambda, ADR 0054), addressed by path:
# included by the locations of the static host and of the internal server that reach the app. The CORS of the
# static host are those of nginx.
proxy_set_header Host $host;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_read_timeout 60s;
proxy_pass http://$ministack/_aws/execute-api/prospecter-dev-storage/local$request_uri;
