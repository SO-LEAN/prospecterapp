# The front controller of the storage app on PHP-FPM, the default (make start): included by the locations of the
# static host and of the internal server that reach the app
fastcgi_pass $php_fpm:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/src/apps/storage/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/src/apps/storage/public;
