; the command line over the settings of Bref for its Lambdas (bref.ini)
date.timezone = Europe/Paris
memory_limit = 256M
display_errors = stderr

; OPcache in memory, as on any command line: the file cache of Bref (opcache.file_cache_only, for its read-only
; Lambdas) is shared by the parallel workers of Rector and PHPStan, which then read classes being written
opcache.file_cache =
opcache.file_cache_only = 0

; the extensions the layer ships disabled, as the php/conf.d of the apps enable them in their functions
extension = intl
; installed but off by default: XDEBUG_MODE=debug,coverage to enable it
zend_extension = xdebug
xdebug.mode = "off"
xdebug.client_host = host.docker.internal
