# The stack of a worktree, where an agent works (ADR 0116): published on a port of its own (make/stack-port.sh), the
# hosts of the stack listening on it, so that its journeys in its Docker network and a browser on the host reach the
# same addresses; every container in the slice of the agents (make agents-slice sets its budget), each bounded, so
# that an agent neither takes the machine nor the share of the others. Added by make (make/common.mk) in a worktree.
x-agents: &agents
  cgroup_parent: prospecter-agents.slice

services:
  # the command line: tests, PHPStan, Composer
  php:
    <<: *agents
    cpus: 2
    mem_limit: 4g
  # the dev server of Vite, and the command line: Vitest, TypeScript, the build
  node:
    <<: *agents
    cpus: 2
    mem_limit: 3g
    environment:
      VITE_API_URL: https://api.local.prospecter.io:${PUBLIC_PORT}
  nginx:
    <<: *agents
    ports:
      - "127.0.0.1:${PUBLIC_PORT}:${PUBLIC_PORT}"
    cpus: 0.5
    mem_limit: 256m
  ministack:
    <<: *agents
    cpus: 2
    # the tens of reactions of a gesture (the journey stopping to prospect) take it beyond 2 GB at once: killed there,
    # it loses them with its functions (ADR 0118)
    mem_limit: 4g
    environment:
      # MiniStack 1.5.27 passes the memory to the functions it starts, neither their CPU nor their cgroup: bounded as on
      # AWS (1024 MB, docker/lambda/deploy.sh), they go back to their warm TTL sooner than in the main checkout
      LAMBDA_DOCKER_FLAGS: -v ${PROJECT_DIR:-${PWD}}:/var/www/src --memory=1g
      LAMBDA_WARM_TTL_SECONDS: "600"
      # its limit of memory would otherwise bound the functions running at once: those of a rule beyond it would be
      # lost (docs/architecture/local-stack.md)
      LAMBDA_ACCOUNT_CONCURRENCY: "0"
  ministack-test:
    <<: *agents
    cpus: 2
    mem_limit: 1g
  lambda-deploy:
    <<: *agents
