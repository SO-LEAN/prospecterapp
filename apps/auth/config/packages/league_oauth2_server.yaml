league_oauth2_server:
    authorization_server:
        private_key: '%env(resolve:OAUTH_PRIVATE_KEY)%'
        private_key_passphrase: '%env(resolve:OAUTH_PASSPHRASE)%'
        encryption_key: '%env(resolve:OAUTH_ENCRYPTION_KEY)%'
        access_token_ttl: PT15M
        refresh_token_ttl: P30D
        auth_code_ttl: PT1M
        # the SPA uses the authorization code grant with PKCE (OAuth 2.1); legacy grants stay off
        enable_password_grant: false
        enable_implicit_grant: false
        require_code_challenge_for_public_clients: true
    resource_server:
        public_key: '%env(resolve:OAUTH_PUBLIC_KEY)%'
    scopes:
        available: ['api']
        default: ['api']
    persistence:
        doctrine: null
    client:
        allow_plaintext_secrets: false

when@test:
    services:
        league.oauth2_server.password_hasher:
            class: Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher
            arguments:
                $cost: 4
