security:
    password_hashers:
        App\Credentials: auto

    providers:
        members:
            id: App\Security\MemberProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        # the token endpoint authenticates the clients itself
        oauth_token:
            pattern: ^/token$
            security: false
        # what I sign in with, changed with an access token of my own
        me:
            pattern: ^/auth/
            stateless: true
            provider: members
            oauth2: true
            entry_point: App\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\Security\ApiAccessDeniedHandler
        # the SPA signs the member in here (session cookie) before /authorize issues it a code (ADR 0037)
        main:
            lazy: true
            provider: members
            custom_authenticators:
                - App\Security\SignInAuthenticator
            entry_point: App\Security\SignInAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: logout

    access_control:
        - { path: ^/auth/, roles: IS_AUTHENTICATED }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/authorize, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # hashing is slow on purpose: keep the tests fast
            App\Credentials:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
