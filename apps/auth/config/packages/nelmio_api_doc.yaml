nelmio_api_doc:
    documentation:
        info:
            title: Prospecter sign-in
            description: |
                What a member signs in with (login email, password), on the authorization server.
                `Authorization: Bearer <access token>` of the SPA on every call; errors are RFC 9457 problem details.
            version: 1.0.0
        components:
            securitySchemes:
                bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearer: []
    areas:
        default:
            path_patterns: ['^/auth/me']
