app.swagger:
    path: /api/doc.json
    methods: GET
    host: '%app_api_host%'
    defaults: { _controller: nelmio_api_doc.controller.swagger }

app.swagger_ui:
    path: /api/doc
    methods: GET
    host: '%app_api_host%'
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

# the icon of its pages
app.doc:
    resource: ../../src/Doc/
    type: attribute
    host: '%app_api_host%'
