parameters:
    google_api_url: 'https://maps.googleapis.com/maps/api/geocode/json'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Prospecter\Core\UseCase\AbstractUseCase:
            tags: ['use_case']
            lazy: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Api/Input/'
            - '../src/Api/Resource/'
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Service/Image/UrlImageInfo.php'

    # Use cases (clean architecture library)
    Prospecter\Core\UseCase\UseCasesFacade: ~
    Prospecter\Core\UseCase\:
        resource: '../vendor/prospecter/core/src/UseCase/*/*Impl.php'

    # Gateways: library interfaces implemented by the application
    Prospecter\Core\Gateway\Entity\UserGateway: '@App\Gateway\Entity\UserRepositoryAdapter'
    Prospecter\Core\Gateway\Entity\OrganizationGateway: '@App\Gateway\Entity\OrganizationRepositoryAdapter'
    Prospecter\Core\Gateway\Entity\Transaction: '@App\Gateway\Entity\TransactionEntityManagerAdapter'
    Prospecter\Core\Gateway\Storage: '@App\Gateway\StorageLocalAdapter'
    Prospecter\Core\Gateway\UserNotifier: '@App\Gateway\UserNotifierSymfonyAdapter'
    Prospecter\Core\Gateway\GeoLocation: '@App\Gateway\GeoLocatorAdapter'

    App\Gateway\Entity\UserRepositoryAdapter:
        lazy: true
        arguments:
            $entityClass: 'Prospecter\Core\Entity\User'
    App\Gateway\Entity\OrganizationRepositoryAdapter:
        lazy: true
        arguments:
            $entityClass: 'Prospecter\Core\Entity\Organization'

    # Security
    App\Security\ProspecterAuthenticator:
        arguments:
            $loginRoute: 'login'
            $defaultSuccessUrl: '%env(FRONT_URL)%'

    # Services
    App\Service\LocalStorageService:
        arguments:
            $path: '%env(resolve:APP_STORAGE_PATH)%'
            $url: '%env(APP_STORAGE_URL)%'
    App\Service\Image\SecretCipherHandler:
        arguments:
            $secret: '%env(APP_SECRET)%'
    App\Service\GeoLocator: '@App\Service\GoogleMapGeoLocator'
    App\Service\GoogleMapGeoLocator:
        arguments:
            $apiUrl: '%google_api_url%'
            $apiKey: '%env(APP_GOOGLE_API_KEY)%'
