parameters:
    # the credentials of the AWS SDK: the keys of MiniStack locally, in a Lambda the temporary ones of its role,
    # valid only with their session token
    app.aws_credentials:
        key: '%env(AWS_ACCESS_KEY_ID)%'
        secret: '%env(AWS_SECRET_ACCESS_KEY)%'
        token: '%env(default::AWS_SESSION_TOKEN)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # every command handler of the core is registered on the command bus, through the translation of its
        # refusals (App\Shared\DependencyInjection\RefusalTranslatingHandlersPass)
        Prospecter\Core\SharedKernel\Application\CommandHandler:
            tags: [app.command_handler]
        # every query handler of the core is injected through the translation of its refusals, by the name of
        # its intent: RefusalTranslatingHandler $consultOrganization
        Prospecter\Core\SharedKernel\Application\QueryHandler:
            tags: [app.query_handler]
        # every event handler of the core reacts on the event bus, within the command that published
        Prospecter\Core\SharedKernel\Application\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Input/'
            - '../src/*/Resource/'
            - '../src/Dashboard/DashboardResource.php'
            - '../src/Security/User.php'
            - '../src/Kernel.php'
            - '../src/Shared/Persistence/Table.php'

    # Handlers of the core: commands go through the command bus, queries are called by the controllers, the
    # published queries by the anticorruption layers of the other contexts (ADR 0045)
    Prospecter\Core\:
        resource: '../vendor/prospecter/core/src/{Accounts,PersonalData,Prospecting}/Application/*/*Handler.php'

    # Services of the hexagon, injected in its handlers (ADR 0044)
    Prospecter\Core\SharedKernel\Application\FileStore: ~
    Prospecter\Core\SharedKernel\Application\GeoLocalizer: ~
    Prospecter\Core\Prospecting\Domain\EmailUniqueness: ~
    Prospecter\Core\Prospecting\Domain\OrphanContacts: ~
    Prospecter\Core\Prospecting\Domain\ContactOrganizations: ~
    Prospecter\Core\PersonalData\Domain\EmailUniqueness: ~

    # DynamoDB (ADR 0048): MiniStack locally (DYNAMODB_ENDPOINT), AWS in production (DYNAMODB_ENDPOINT empty);
    # one table per bounded context, injected by name in its repositories only (Table $prospectingTable)
    Aws\DynamoDb\DynamoDbClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::DYNAMODB_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    Aws\DynamoDb\Marshaler:
        arguments: [{ nullify_invalid: true }]
    app.table.accounts:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-accounts' }
    app.table.personal_data:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-personal-data' }
    app.table.prospecting:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-prospecting' }
    App\Shared\Persistence\Table $accountsTable: '@app.table.accounts'
    App\Shared\Persistence\Table $personalDataTable: '@app.table.personal_data'
    App\Shared\Persistence\Table $prospectingTable: '@app.table.prospecting'

    # Ports of the core, implemented by the application
    Prospecter\Core\Accounts\Domain\AccountRepository: '@App\Accounts\Persistence\DynamoAccountRepository'
    Prospecter\Core\Accounts\Domain\MemberRepository: '@App\Accounts\Persistence\DynamoMemberRepository'
    Prospecter\Core\PersonalData\Domain\PersonRepository: '@App\PersonalData\Persistence\DynamoPersonRepository'
    Prospecter\Core\PersonalData\Domain\ReaderService: '@App\PersonalData\AccountsReaderService'
    Prospecter\Core\Prospecting\Domain\OrganizationRepository: '@App\Prospecting\Persistence\DynamoOrganizationRepository'
    Prospecter\Core\Prospecting\Domain\ExchangeRepository: '@App\Prospecting\Persistence\DynamoExchangeRepository'
    Prospecter\Core\Prospecting\Domain\ProspectorService: '@App\Prospecting\AccountsProspectorService'
    Prospecter\Core\Prospecting\Domain\KnownContacts: '@App\Prospecting\PersonalDataKnownContacts'
    Prospecter\Core\PersonalData\Domain\ProspectedOrganizations: '@App\PersonalData\ProspectingOrganizations'
    Prospecter\Core\SharedKernel\Application\Port\Events: '@App\Shared\MessengerEvents'
    Prospecter\Core\SharedKernel\Application\Port\GeoLocation: '@App\Shared\GeoplateformeGeoLocation'
    Prospecter\Core\SharedKernel\Application\Port\Storage: '@App\Shared\StorageClient'
    # the files of Swagger UI asked at the installed version of NelmioApiDocBundle
    App\Doc\VersionedNelmioAssets:
        decorates: nelmio_api_doc.render_docs.html.asset
        arguments: ['@.inner']
    # the internal entry of the storage: the token alone locally, signed by the role of the function on AWS (ADR 0068)
    App\Shared\StorageAuthentication: '@App\Shared\TokenOnlyStorageAuthentication'

    # Cognito (ADR 0052): the user pool the members sign in with, MiniStack locally (COGNITO_ENDPOINT), AWS in
    # production (COGNITO_ENDPOINT empty)
    Aws\CognitoIdentityProvider\CognitoIdentityProviderClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::COGNITO_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\SignIn\UserPool:
        arguments:
            $name: '%env(COGNITO_USER_POOL_NAME)%'
            $region: '%env(AWS_REGION)%'
            $keysUrl: '%env(COGNITO_KEYS_URL)%'
    # the keys of the user pool are read for real, in the tests too (they run on MiniStack)
    app.signing_keys_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: [Symfony\Component\HttpClient\HttpClient, create]
    App\SignIn\SigningKeys:
        arguments: { $httpClient: '@app.signing_keys_client' }
    # the time the access tokens are checked at: the real one (the controllers use the clock of the tests)
    app.token_clock:
        class: Symfony\Component\Clock\NativeClock

when@test:
    services:
        # no network in tests: every outgoing request gets an empty answer (a geocoding finds nothing)
        http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
        # the files stay in memory: the storage app is tested on its own
        Prospecter\Core\SharedKernel\Application\Port\Storage: '@Tests\App\Double\InMemoryStorage'
        Tests\App\Double\InMemoryStorage:
            public: true
        # the moment the controllers give the commands: fixed, so that the tests can name it
        clock:
            class: Symfony\Component\Clock\MockClock
            arguments: ['2026-10-15 09:00:00 UTC']
        # the tokens come from MiniStack, issued now: checked now, a test may wait for one to expire
        app.token_clock:
            class: Symfony\Component\Clock\MockClock
            public: true

when@prod:
    services:
        App\Shared\StorageAuthentication: '@App\Shared\SigV4StorageAuthentication'
