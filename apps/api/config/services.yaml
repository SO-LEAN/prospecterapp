services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # every command handler of the core is registered on the command bus
        Prospecter\Core\Application\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]

    App\:
        resource: '../src/'
        exclude:
            - '../src/Api/Input/'
            - '../src/Api/Resource/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Service/Image/UrlImageInfo.php'

    # Handlers of the core: commands go through the command bus, queries are called by the controllers
    Prospecter\Core\Application\:
        resource: '../vendor/prospecter/core/src/Application/{Organization,Account}/*/*Handler.php'

    # Ports of the core, implemented by the application
    Prospecter\Core\Domain\Organization\OrganizationRepository: '@App\Repository\DoctrineOrganizationRepository'
    Prospecter\Core\Domain\User\UserRepository: '@App\Repository\DoctrineUserRepository'
    Prospecter\Core\Application\Port\Storage: '@App\Gateway\LocalStorage'
    Prospecter\Core\Application\Port\GeoLocation: '@App\Gateway\GeoplateformeGeoLocation'

    # Security
    App\Security\ProspecterAuthenticator:
        arguments:
            $loginRoute: 'login'
            $defaultSuccessUrl: '%env(FRONT_URL)%'

    # Services
    App\Service\LocalStorageService:
        arguments:
            $path: '%env(resolve:APP_STORAGE_PATH)%'
            $url: '%env(APP_STORAGE_URL)%'
    App\Service\Image\SecretCipherHandler:
        arguments:
            $secret: '%env(APP_SECRET)%'

when@test:
    services:
        # no network in tests: every outgoing request gets an empty answer (a geocoding finds nothing)
        http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
