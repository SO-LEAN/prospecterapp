parameters:
    # the credentials of the AWS SDK: the keys of MiniStack locally, in a Lambda the temporary ones of its role,
    # valid only with their session token
    app.aws_credentials:
        key: '%env(AWS_ACCESS_KEY_ID)%'
        secret: '%env(AWS_SECRET_ACCESS_KEY)%'
        token: '%env(default::AWS_SESSION_TOKEN)%'
    # the table of each context, by the name its sources give it: where the outbox of a commit and the inbox of a
    # subscription are written
    app.context_tables:
        accounts: '%env(DYNAMODB_TABLE_PREFIX)%-accounts'
        personal-data: '%env(DYNAMODB_TABLE_PREFIX)%-personal-data'
        prospecting: '%env(DYNAMODB_TABLE_PREFIX)%-prospecting'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # every command handler of the core is registered on the command bus, through the translation of its
        # refusals, then its unit of work (App\Shared\DependencyInjection\RefusalTranslatingHandlersPass)
        Prospecter\Core\SharedKernel\Application\CommandHandler:
            tags: [app.command_handler]
        # every query handler of the core is injected through the translation of its refusals, by the name of
        # its intent: QueryHandler $consultOrganization
        Prospecter\Core\SharedKernel\Application\QueryHandler:
            tags: [app.query_handler]
        # every event handler of the core reacts through the translation of its refusals, within the unit of work of
        # the command that published: a translator on the event bus, any other as the subscription naming it in
        # config/subscriptions.json (App\Shared\DependencyInjection\SubscriptionsPass)
        Prospecter\Core\SharedKernel\Application\EventHandler:
            tags: [app.event_handler]

    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Input/'
            - '../src/*/Resource/'
            - '../src/*/Presenter/'
            - '../src/*/*Presenter.php'
            - '../src/Exchanges/ExchangeParticipants.php'
            - '../src/Dashboard/DashboardResource.php'
            - '../src/Security/User.php'
            - '../src/Kernel.php'
            - '../src/Shared/Persistence/Table.php'
            - '../src/Shared/Persistence/Write.php'

    # Handlers of the core: commands go through the command bus, queries are called by the controllers, the
    # published services by the anticorruption layers of the other contexts (ADR 0045, 0089)
    Prospecter\Core\:
        resource: '../vendor/prospecter/core/src/{Accounts,PersonalData,Prospecting,Reporting}/Application/*/*Handler.php'
        exclude: '../vendor/prospecter/core/src/Reporting/Application/RebuildFigures/RebuildFiguresHandler.php'
    # its steps commit their own units (ADR 0103): called by app:reporting:rebuild, out of the command bus
    Prospecter\Core\Reporting\Application\RebuildFigures\RebuildFiguresHandler:
        autoconfigure: false

    # Services of the hexagon, injected in its handlers (ADR 0044)
    Prospecter\Core\SharedKernel\Application\FileStore: ~
    Prospecter\Core\SharedKernel\Application\GeoLocalizer: ~
    Prospecter\Core\Prospecting\Domain\Service\EmailUniqueness: ~
    Prospecter\Core\Prospecting\Domain\Service\OrphanContacts: ~
    Prospecter\Core\Prospecting\Domain\Service\ContactOrganizations: ~
    Prospecter\Core\PersonalData\Domain\Service\EmailUniqueness: ~
    Prospecter\Core\Reporting\Application\FactRecorder: ~
    Prospecter\Core\Reporting\Application\RebuildFigures\SourceFacts: ~

    # DynamoDB (ADR 0048): MiniStack locally (DYNAMODB_ENDPOINT), AWS in production (DYNAMODB_ENDPOINT empty);
    # one table per bounded context, injected by name in its repositories only (Table $prospectingTable)
    Aws\DynamoDb\DynamoDbClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::DYNAMODB_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    Aws\DynamoDb\Marshaler:
        arguments: [{ nullify_invalid: true }]
    app.table.accounts:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-accounts' }
    app.table.personal_data:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-personal-data' }
    app.table.prospecting:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-prospecting' }
    app.table.reporting:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-reporting' }
    App\Shared\Persistence\Table $accountsTable: '@app.table.accounts'
    App\Shared\Persistence\Table $personalDataTable: '@app.table.personal_data'
    App\Shared\Persistence\Table $prospectingTable: '@app.table.prospecting'
    App\Shared\Persistence\Table $reportingTable: '@app.table.reporting'

    # The services the contexts offer each other, answered in process by the handlers of their Contracts (ADR 0089)
    Prospecter\Core\Accounts\Contract\Service\ConsultMembers\ConsultMembersService: '@Prospecter\Core\Accounts\Application\ConsultMembers\ConsultMembersHandler'
    Prospecter\Core\PersonalData\Contract\Service\WhichAreContacts\WhichAreContactsService: '@Prospecter\Core\PersonalData\Application\WhichAreContacts\WhichAreContactsHandler'
    Prospecter\Core\Prospecting\Contract\Service\WhichAreProspected\WhichAreProspectedService: '@Prospecter\Core\Prospecting\Application\WhichAreProspected\WhichAreProspectedHandler'
    Prospecter\Core\Prospecting\Contract\Service\ListOrganizationFacts\ListOrganizationFactsService: '@Prospecter\Core\Prospecting\Application\ListOrganizationFacts\ListOrganizationFactsHandler'
    Prospecter\Core\Prospecting\Contract\Service\ListExchangeFacts\ListExchangeFactsService: '@Prospecter\Core\Prospecting\Application\ListExchangeFacts\ListExchangeFactsHandler'
    Prospecter\Core\PersonalData\Contract\Service\ListContactFacts\ListContactFactsService: '@Prospecter\Core\PersonalData\Application\ListContactFacts\ListContactFactsHandler'
    Prospecter\Core\Accounts\Contract\Service\ListAccounts\ListAccountsService: '@Prospecter\Core\Accounts\Application\ListAccounts\ListAccountsHandler'

    # Ports of the core, implemented by the application
    Prospecter\Core\Accounts\Domain\Repository\AccountRepository: '@App\Accounts\Persistence\DynamoAccountRepository'
    Prospecter\Core\Accounts\Domain\Repository\MemberRepository: '@App\Accounts\Persistence\DynamoMemberRepository'
    Prospecter\Core\Accounts\Application\Port\MyAccountRetriever: '@App\Accounts\Persistence\DynamoMyAccountRetriever'
    Prospecter\Core\Accounts\Application\Port\MemberRetriever: '@App\Accounts\Persistence\DynamoMemberRetriever'
    Prospecter\Core\Accounts\Application\Port\AccountListRetriever: '@App\Accounts\Persistence\DynamoAccountListRetriever'
    Prospecter\Core\PersonalData\Domain\Repository\PersonRepository: '@App\PersonalData\Persistence\DynamoPersonRepository'
    Prospecter\Core\PersonalData\Application\Port\PersonCardRetriever: '@App\PersonalData\Persistence\DynamoPersonCardRetriever'
    Prospecter\Core\PersonalData\Application\Port\ContactPageRetriever: '@App\PersonalData\Persistence\DynamoContactPageRetriever'
    Prospecter\Core\PersonalData\Application\Port\ContactFactsRetriever: '@App\PersonalData\Persistence\DynamoContactFactsRetriever'
    Prospecter\Core\PersonalData\Domain\Port\Readers: '@App\PersonalData\AntiCorruption\AccountsReaders'
    Prospecter\Core\Prospecting\Domain\Repository\OrganizationRepository: '@App\Prospecting\Persistence\DynamoOrganizationRepository'
    Prospecter\Core\Prospecting\Domain\Repository\ExchangeRepository: '@App\Prospecting\Persistence\DynamoExchangeRepository'
    Prospecter\Core\Prospecting\Application\Port\FoundOrganizationRetriever: '@App\Prospecting\Persistence\DynamoFoundOrganizationRetriever'
    Prospecter\Core\Prospecting\Application\Port\OrganizationSheetRetriever: '@App\Prospecting\Persistence\DynamoOrganizationSheetRetriever'
    Prospecter\Core\Prospecting\Application\Port\ExchangeDetailRetriever: '@App\Prospecting\Persistence\DynamoExchangeDetailRetriever'
    Prospecter\Core\Prospecting\Application\Port\TimelineRetriever: '@App\Prospecting\Persistence\DynamoTimelineRetriever'
    Prospecter\Core\Prospecting\Application\Port\OrganizationOfContactRetriever: '@App\Prospecting\Persistence\DynamoOrganizationOfContactRetriever'
    Prospecter\Core\Prospecting\Application\Port\OrganizationFactsRetriever: '@App\Prospecting\Persistence\DynamoOrganizationFactsRetriever'
    Prospecter\Core\Prospecting\Application\Port\ExchangeFactsRetriever: '@App\Prospecting\Persistence\DynamoExchangeFactsRetriever'
    Prospecter\Core\Reporting\Domain\Repository\FactRepository: '@App\Reporting\Persistence\DynamoFactRepository'
    Prospecter\Core\Reporting\Application\Port\FiguresRetriever: '@App\Reporting\Persistence\DynamoFiguresRetriever'
    Prospecter\Core\Reporting\Application\Port\ProjectionVersions: '@App\Reporting\Persistence\DynamoProjectionVersions'
    Prospecter\Core\Reporting\Application\Port\RecordingsInFlight: '@App\Reporting\RecordingsOfTheWorker'
    Prospecter\Core\Reporting\Domain\Port\SourceAccounts: '@App\Reporting\AntiCorruption\AccountsSourceAccounts'
    Prospecter\Core\Reporting\Domain\Port\ProspectingFacts: '@App\Reporting\AntiCorruption\ProspectingFactsFromProspecting'
    Prospecter\Core\Reporting\Domain\Port\PersonalDataFacts: '@App\Reporting\AntiCorruption\PersonalDataFactsFromPersonalData'
    # the moment a terminal fact is forgotten at counted from now, the real one
    App\Reporting\Persistence\DynamoFactRepository:
        arguments: { $clock: '@app.commit_clock' }
    App\Reporting\Persistence\DynamoProjectionVersions:
        arguments: { $clock: '@app.commit_clock' }
    Prospecter\Core\Prospecting\Domain\Port\Prospectors: '@App\Prospecting\AntiCorruption\AccountsProspectors'
    Prospecter\Core\Prospecting\Domain\Port\KnownContacts: '@App\Prospecting\AntiCorruption\PersonalDataKnownContacts'
    Prospecter\Core\PersonalData\Domain\Port\ProspectedOrganizations: '@App\PersonalData\AntiCorruption\ProspectingOrganizations'
    # a domain event to the translators of its context on the event bus, every event to the reactions of the
    # subscriptions of config/subscriptions.json, delivered the way INTEGRATION_EVENTS_DELIVERY names: sync, within
    # the command, or outbox, written with it and relayed to the bus
    Prospecter\Core\SharedKernel\Application\Port\Events: '@App\Shared\Messaging\RoutingEvents'
    app.deliveries:
        class: Symfony\Component\DependencyInjection\ServiceLocator
        arguments: [{ sync: '@App\Shared\Messaging\SynchronousDelivery', outbox: '@App\Shared\Messaging\OutboxDelivery' }]
        tags: [container.service_locator]
    App\Shared\Messaging\Delivery:
        factory: ['@app.deliveries', 'get']
        arguments: ['%env(INTEGRATION_EVENTS_DELIVERY)%']
    # the outbox of a commit, written in the table of the context its events happened in, named as their sources
    # name it; the moment of the commit the real one, the table forgetting the item a week later
    App\Shared\Messaging\CommitOutbox:
        arguments:
            $tables: '%app.context_tables%'
            $clock: '@app.commit_clock'
    app.commit_clock:
        class: Symfony\Component\Clock\NativeClock
    # EventBridge (ADR 0098): MiniStack locally (EVENTBRIDGE_ENDPOINT), AWS in production (EVENTBRIDGE_ENDPOINT
    # empty); the relay, a function of its own, publishes the outbox on the bus INTEGRATION_EVENT_BUS
    Aws\EventBridge\EventBridgeClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::EVENTBRIDGE_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\Shared\Messaging\IntegrationEventBus:
        arguments: { $name: '%env(INTEGRATION_EVENT_BUS)%' }
    App\Shared\Messaging\OutboxRelay:
        public: true
    # the worker (ADR 0101), a function of its own the rules of the subscriptions invoke: the inbox of a subscription
    # in the table of its context, what it could not apply kept in INTEGRATION_FAILURES_QUEUE, invoked again by
    # app:integration:redrive; SQS and Lambda of MiniStack locally (SQS_ENDPOINT, LAMBDA_ENDPOINT), of AWS in
    # production (empty)
    App\Shared\Messaging\IntegrationEventConsumer:
        public: true
    App\Shared\Messaging\Inbox:
        arguments:
            $tables: '%app.context_tables%'
            $clock: '@app.commit_clock'
    Aws\Sqs\SqsClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::SQS_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\Shared\Messaging\IntegrationFailures:
        arguments: { $name: '%env(INTEGRATION_FAILURES_QUEUE)%', $clock: '@app.commit_clock' }
    # app:consistency:check counts what waits in the failures of the worker and in those of the relay (ADR 0105)
    App\Consistency\FailureQueues:
        arguments: { $integrationFailures: '%env(INTEGRATION_FAILURES_QUEUE)%', $relayFailures: '%env(RELAY_FAILURES_QUEUE)%' }
    Aws\Lambda\LambdaClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::LAMBDA_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\Shared\Messaging\IntegrationWorker:
        arguments: { $name: '%env(INTEGRATION_WORKER)%' }
    # what a command writes, and what its reactions write, in one transaction of DynamoDB, all or nothing
    Prospecter\Core\SharedKernel\Application\Port\UnitOfWork: '@App\Shared\Persistence\DynamoUnitOfWork'
    Prospecter\Core\SharedKernel\Application\Port\GeoLocation: '@App\Shared\GeoplateformeGeoLocation'
    Prospecter\Core\SharedKernel\Application\Port\Storage: '@App\Shared\StorageClient'
    # the private files of the storage, sent by the browsers themselves (ADR 0077)
    Prospecter\Core\SharedKernel\Application\Port\PrivateStorage: '@App\Shared\PrivateStorageClient'
    App\Shared\UploadForms: '@App\Shared\PrivateStorageClient'
    # the files of Swagger UI asked at the installed version of NelmioApiDocBundle
    App\Doc\VersionedNelmioAssets:
        decorates: nelmio_api_doc.render_docs.html.asset
        arguments: ['@.inner']
    # the internal entry of the storage: the token alone locally, signed by the role of the function on AWS (ADR 0068)
    App\Shared\StorageAuthentication: '@App\Shared\TokenOnlyStorageAuthentication'

    # Cognito (ADR 0052): the user pool the members sign in with, MiniStack locally (COGNITO_ENDPOINT), AWS in
    # production (COGNITO_ENDPOINT empty)
    Aws\CognitoIdentityProvider\CognitoIdentityProviderClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::COGNITO_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\SignIn\UserPool:
        arguments:
            $name: '%env(COGNITO_USER_POOL_NAME)%'
            $region: '%env(AWS_REGION)%'
            $keysUrl: '%env(COGNITO_KEYS_URL)%'
    # the keys of the user pool are read for real, in the tests too (they run on MiniStack)
    app.signing_keys_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: [Symfony\Component\HttpClient\HttpClient, create]
    App\SignIn\SigningKeys:
        arguments: { $httpClient: '@app.signing_keys_client' }
    # the time the access tokens are checked at: the real one (the controllers use the clock of the tests)
    app.token_clock:
        class: Symfony\Component\Clock\NativeClock

when@test:
    services:
        # no network in tests: every outgoing request gets an empty answer (a geocoding finds nothing)
        http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
        # the files stay in memory: the storage app is tested on its own
        Prospecter\Core\SharedKernel\Application\Port\Storage: '@Tests\App\Double\InMemoryStorage'
        Tests\App\Double\InMemoryStorage:
            public: true
        Prospecter\Core\SharedKernel\Application\Port\PrivateStorage: '@Tests\App\Double\InMemoryPrivateStorage'
        App\Shared\UploadForms: '@Tests\App\Double\InMemoryPrivateStorage'
        Tests\App\Double\InMemoryPrivateStorage:
            public: true
        # the recordings of the facts, cancelled when a test asks it to
        Tests\App\Double\ConflictingFactRepository:
            decorates: Prospecter\Core\Reporting\Domain\Repository\FactRepository
            arguments: ['@.inner']
            public: true
        # the figures, which no page shows yet: kept for their tests
        Prospecter\Core\Reporting\Application\Port\FiguresRetriever:
            alias: App\Reporting\Persistence\DynamoFiguresRetriever
            public: true
        # a reaction that throws when a test asks it to, a subscription like those of the core
        Tests\App\Double\FailingReaction:
            public: true
            tags:
                - { name: app.subscription, subscription: prospecting-failing-reaction, context: prospecting, source: prospecter.prospecting.internal, event: ObservationsWritten.v1, inbox: true }
        # another request taking an email meanwhile, when a test asks it to
        Tests\App\Double\EmailTakenMeanwhile:
            autowire: true
            public: true
            tags: [app.event_handler]
        # what the worker logs, read by its tests
        App\Shared\Messaging\IntegrationEventConsumer:
            autowire: true
            public: true
            arguments: { $logger: '@Tests\App\Double\InMemoryLogger' }
        Tests\App\Double\InMemoryLogger:
            public: true
        # the queue of the failures and the worker in memory: the worker is tested on its own
        Aws\Sqs\SqsClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  credentials: '%app.aws_credentials%'
                  handler: '@Tests\App\Double\InMemorySqs'
        Tests\App\Double\InMemorySqs:
            public: true
        Aws\Lambda\LambdaClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  credentials: '%app.aws_credentials%'
                  handler: '@Tests\App\Double\InMemoryLambda'
        Tests\App\Double\InMemoryLambda:
            public: true
        # the bus in memory: the relay is tested on its own
        Aws\EventBridge\EventBridgeClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  credentials: '%app.aws_credentials%'
                  handler: '@Tests\App\Double\InMemoryEventBridge'
        Tests\App\Double\InMemoryEventBridge:
            public: true
        # the moment the controllers give the commands: fixed, so that the tests can name it
        clock:
            class: Symfony\Component\Clock\MockClock
            arguments: ['2026-10-15 09:00:00 UTC']
        # the tokens come from MiniStack, issued now: checked now, a test may wait for one to expire
        app.token_clock:
            class: Symfony\Component\Clock\MockClock
            public: true

when@prod:
    services:
        App\Shared\StorageAuthentication: '@App\Shared\SigV4StorageAuthentication'
