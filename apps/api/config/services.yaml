    # a domain event to the translators of its context on the event bus, every event to the reactions of the
    # subscriptions of config/subscriptions.json, delivered the way INTEGRATION_EVENTS_DELIVERY names: sync, within
    # the command, or outbox, written with it and relayed to the bus
    Prospecter\Core\SharedKernel\Application\Port\Events: '@App\Shared\Messaging\RoutingEvents'
    app.deliveries:
        class: Symfony\Component\DependencyInjection\ServiceLocator
        arguments: [{ sync: '@App\Shared\Messaging\SynchronousDelivery', outbox: '@App\Shared\Messaging\OutboxDelivery' }]
        tags: [container.service_locator]
    App\Shared\Messaging\Delivery:
        factory: ['@app.deliveries', 'get']
        arguments: ['%env(INTEGRATION_EVENTS_DELIVERY)%']
    # the outbox of a commit, written in the table of the context its events happened in, named as their sources
    # name it; the moment of the commit the real one, the table forgetting the item a week later
    App\Shared\Messaging\CommitOutbox:
        arguments:
            $tables: '%app.context_tables%'
            $clock: '@app.commit_clock'
    app.commit_clock:
        class: Symfony\Component\Clock\NativeClock
    # EventBridge (ADR 0098): MiniStack locally (EVENTBRIDGE_ENDPOINT), AWS in production (EVENTBRIDGE_ENDPOINT
    # empty); the relay, a function of its own, publishes the outbox on the bus INTEGRATION_EVENT_BUS
    Aws\EventBridge\EventBridgeClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::EVENTBRIDGE_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\Shared\Messaging\IntegrationEventBus:
        arguments: { $name: '%env(INTEGRATION_EVENT_BUS)%' }
    App\Shared\Messaging\OutboxRelay:
        public: true
    # the worker (ADR 0101), a function of its own the rules of the subscriptions invoke: the inbox of a subscription
    # in the table of its context, what it could not apply kept in INTEGRATION_FAILURES_QUEUE, invoked again by
    # app:integration:redrive; SQS and Lambda of MiniStack locally (SQS_ENDPOINT, LAMBDA_ENDPOINT), of AWS in
    # production (empty)
    App\Shared\Messaging\IntegrationEventConsumer:
        public: true
    # the function the daily schedule of an instance calls, running every scheduled task: the erasure of the contacts
    # left unattached (ADR 0146), the renewal of the watches of Gmail (ADR 0154)
    App\Shared\ScheduledTasksFunction:
        public: true
    # the worker of the local stack, taking the invocations of the rules from a queue (docker/lambda/deploy.sh)
    App\Shared\Messaging\QueuedIntegrationEventConsumer:
        public: true
    App\Shared\Messaging\Inbox:
        arguments:
            $tables: '%app.context_tables%'
            $clock: '@app.commit_clock'
    Aws\Sqs\SqsClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::SQS_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    # the secrets the accounts give the api, SecureStrings of SSM under the path of the instance (ADR 0125): the SSM of
    # MiniStack locally (SSM_ENDPOINT), that of AWS in production (SSM_ENDPOINT empty)
    Aws\Ssm\SsmClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::SSM_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\Shared\Persistence\AccountSecrets:
        arguments: { $path: '%env(ACCOUNT_SECRETS_PATH)%' }
    App\Shared\Messaging\IntegrationFailures:
        arguments: { $name: '%env(INTEGRATION_FAILURES_QUEUE)%', $clock: '@app.commit_clock' }
    # app:consistency:check counts what waits in the failures of the worker and in those of the relay (ADR 0105)
    App\Consistency\FailureQueues:
        arguments: { $integrationFailures: '%env(INTEGRATION_FAILURES_QUEUE)%', $relayFailures: '%env(RELAY_FAILURES_QUEUE)%' }
    Aws\Lambda\LambdaClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::LAMBDA_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\Shared\Messaging\IntegrationWorker:
        arguments: { $name: '%env(INTEGRATION_WORKER)%' }
    # what a command writes, and what its reactions write, in one transaction of DynamoDB, all or nothing
    Prospecter\Core\SharedKernel\Application\Port\UnitOfWork: '@App\Shared\Persistence\DynamoUnitOfWork'
    Prospecter\Core\SharedKernel\Application\Port\GeoLocation: '@App\Shared\GeoplateformeGeoLocation'
    Prospecter\Core\Prospecting\Domain\Port\EstablishmentDirectory: '@App\Prospecting\Directory\RechercheEntreprisesDirectory'
    Prospecter\Core\SharedKernel\Application\Port\Storage: '@App\Shared\StorageClient'
    # the private files of the storage, sent by the browsers themselves (ADR 0077)
    Prospecter\Core\Prospecting\Application\Port\PrivateStorage: '@App\Prospecting\Storage\PrivateStorageClient'
    App\Shared\UploadForms: '@App\Prospecting\Storage\PrivateStorageClient'
    # the files the AIs join, sent by the API itself with the form of an upload (ADR 0172)
    App\Shared\UploadSender: '@App\Shared\UploadsSentByTheApi'
    App\Shared\UploadsSentByTheApi:
        arguments: { $endpoint: '%env(PRIVATE_UPLOADS_ENDPOINT)%' }
    # the files of Swagger UI asked at the installed version of NelmioApiDocBundle
    App\Doc\VersionedNelmioAssets:
        decorates: nelmio_api_doc.render_docs.html.asset
        arguments: ['@.inner']
    # the internal entry of the storage: the token alone locally, signed by the role of the function on AWS (ADR 0068)
    App\Shared\StorageAuthentication: '@App\Shared\TokenOnlyStorageAuthentication'

    # Cognito (ADR 0052): the user pool the members sign in with, MiniStack locally (COGNITO_ENDPOINT), AWS in
    # production (COGNITO_ENDPOINT empty)
    Aws\CognitoIdentityProvider\CognitoIdentityProviderClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::COGNITO_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    App\SignIn\UserPool:
        arguments:
            $name: '%env(COGNITO_USER_POOL_NAME)%'
            $region: '%env(AWS_REGION)%'
            $keysUrl: '%env(COGNITO_KEYS_URL)%'
    # the keys of the user pool are read for real, in the tests too (they run on MiniStack)
    app.signing_keys_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: [Symfony\Component\HttpClient\HttpClient, create]
    App\SignIn\SigningKeys:
        arguments: { $httpClient: '@app.signing_keys_client' }
    # the facade signing the AIs in (ADR 0157): the metadata documents of their clients, at an address anyone may give,
    # never read on a private network
    app.client_metadata_http:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']
    App\SignIn\OAuth\ClientMetadataDocuments:
        arguments: { $http: '@app.client_metadata_http' }
    # the files the AIs give by their address on the web, images or attachments (ADR 0168), never read on a private network
    app.files_on_the_web_http:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']
    App\Shared\Mcp\FilesOnTheWeb:
        arguments: { $http: '@app.files_on_the_web_http' }
    # and the token endpoint of Cognito, asked for real, in the tests too (they run on MiniStack)
    app.cognito_oauth_http:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: [Symfony\Component\HttpClient\HttpClient, create]
    # the MCP server takes the access tokens of the AIs beside those of the SPA, the API those of the SPA only
    app.mcp_token_handler:
        class: App\Security\AccessTokenHandler
        arguments: { $clientNames: !php/const App\SignIn\UserPool::CLIENT_NAMES_OF_THE_MCP_SERVER }
    # the time the access tokens are checked at: the real one (the controllers use the clock of the tests)
    app.token_clock:
        class: Symfony\Component\Clock\NativeClock

when@test:
    services:
        # each link a resource carries leads to the route its property declares it offers (docs/architecture/api.md, "Links")
        Tests\App\Base\OffersMatchTheirLinks:
            arguments: ['@router']
            tags: [{ name: serializer.normalizer, priority: 1000 }]
        # no network in tests: the services outside the API answer by this double (config/packages/framework.yaml)
        Tests\App\Double\OutsideServices:
            arguments: ['%env(APP_GEOCODER_URL)%', '%env(APP_DIRECTORY_URL)%', '@Tests\App\Double\GoogleDouble', '@Tests\App\Double\ClientsOfTheAIs', '@Tests\App\Double\TheWeb']
            public: true
        # the metadata documents of the AIs, their hosts resolved by the double, the private networks still refused
        Tests\App\Double\ClientsOfTheAIs: ~
        app.client_metadata_http.resolved_by_the_double:
            class: Symfony\Component\HttpClient\DnsResolvingHttpClient
            decorates: app.client_metadata_http
            arguments: ['@.inner', '@Tests\App\Double\ClientsOfTheAIs']
        # the files the AIs give by their address, their hosts resolved by the double, the private networks still refused
        Tests\App\Double\TheWeb:
            public: true
        app.files_on_the_web_http.resolved_by_the_double:
            class: Symfony\Component\HttpClient\DnsResolvingHttpClient
            decorates: app.files_on_the_web_http
            arguments: ['@.inner', '@Tests\App\Double\TheWeb']
        # Google, its tokens and its revocations, by its double behind OutsideServices
        Tests\App\Double\GoogleDouble:
            arguments: ['%env(GOOGLE_TOKEN_URL)%', '%env(GOOGLE_REVOKE_URL)%', '%env(GOOGLE_CALENDAR_URL)%', '%env(GOOGLE_GMAIL_URL)%', '%env(GOOGLE_CERTS_URL)%']
            public: true
        # the files stay in memory: the storage app is tested on its own
        Prospecter\Core\SharedKernel\Application\Port\Storage: '@Tests\App\Double\InMemoryStorage'
        Tests\App\Double\InMemoryStorage:
            public: true
        # the data of the demonstration each API test starts from, made once in each process of the tests
        Tests\App\Base\DataOfTheDemonstration:
            arguments:
                $tables: '@App\Shared\Persistence\Tables'
                $demoData: '@App\Demo\DemoData'
                $dynamoDb: '@Aws\DynamoDb\DynamoDbClient'
                $accountSecrets: '@App\Shared\Persistence\AccountSecrets'
                $ssm: '@Aws\Ssm\SsmClient'
                $secretsPath: '%env(ACCOUNT_SECRETS_PATH)%'
            public: true
        # the user pool each API test starts from, with the members of the demonstration, made once in each process
        Tests\App\Base\MembersOfTheDemonstration:
            arguments:
                $pool: '@App\SignIn\UserPool'
                $demoCredentials: '@App\Demo\DemoCredentials'
                $demoMembers: '@App\Demo\DemoMembers'
            public: true
        Prospecter\Core\Prospecting\Application\Port\PrivateStorage: '@Tests\App\Double\InMemoryPrivateStorage'
        App\Shared\UploadForms: '@Tests\App\Double\InMemoryPrivateStorage'
        App\Shared\UploadSender: '@Tests\App\Double\InMemoryPrivateStorage'
        Tests\App\Double\InMemoryPrivateStorage:
            public: true
        # the recordings of the facts, cancelled when a test asks it to
        Tests\App\Double\ConflictingFactRepository:
            decorates: Prospecter\Core\Reporting\Domain\Repository\FactRepository
            arguments: ['@.inner']
            public: true
        # the figures, read by their tests at the month they choose
        Prospecter\Core\Reporting\Application\Port\FiguresRetriever:
            alias: App\Reporting\Persistence\DynamoFiguresRetriever
            public: true
        # a policy whose command throws when a test asks it to, a subscription like those of the core
        Tests\App\Double\FailingReactionPolicy:
            tags:
                - { name: app.subscription, subscription: prospecting-failing-reaction, context: prospecting, source: prospecter.prospecting.internal, event: ObservationsWritten.v1, inbox: true }
        Tests\App\Double\FailingReaction:
            public: true
            tags: [app.command_handler]
        # a command failed when a test asks it to, before its use case runs
        Tests\App\Double\FailingCommands:
            public: true
        # another request attaching a contact to an organization meanwhile, when a test asks it to (ADR 0181)
        Tests\App\Double\OrganizationChangedMeanwhile:
            decorates: Prospecter\Core\Prospecting\Domain\Repository\OrganizationRepository
            autowire: true
            arguments: { $organizations: '@.inner', $commitClock: '@app.commit_clock' }
            public: true
        # another request correcting the text of an exchange meanwhile, when a test asks it to (ADR 0181)
        Tests\App\Double\ExchangeChangedMeanwhile:
            decorates: Prospecter\Core\Prospecting\Domain\Repository\ExchangeRepository
            autowire: true
            arguments: { $exchanges: '@.inner', $commitClock: '@app.commit_clock' }
            public: true
        # another request taking an email meanwhile, when a test asks it to
        Tests\App\Double\EmailTakenMeanwhile:
            autowire: true
            arguments: { $commitClock: '@app.commit_clock' }
            public: true
            tags: [app.event_handler]
        # what the worker logs, read by its tests
        App\Shared\Messaging\IntegrationEventConsumer:
            autowire: true
            public: true
            arguments: { $logger: '@Tests\App\Double\InMemoryLogger' }
        Tests\App\Double\InMemoryLogger:
            public: true
        # the queue of the failures and the worker in memory: the worker is tested on its own
        Aws\Sqs\SqsClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  credentials: '%app.aws_credentials%'
                  handler: '@Tests\App\Double\InMemorySqs'
        Tests\App\Double\InMemorySqs:
            public: true
        Aws\Lambda\LambdaClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  credentials: '%app.aws_credentials%'
                  handler: '@Tests\App\Double\InMemoryLambda'
        Tests\App\Double\InMemoryLambda:
            public: true
        # the SSM of MiniStack, refusing the operations a test names
        Aws\Ssm\SsmClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  endpoint: '%env(default::SSM_ENDPOINT)%'
                  credentials: '%app.aws_credentials%'
            configurator: ['@Tests\App\Double\RefusingSsm', 'refuseThrough']
        Tests\App\Double\RefusingSsm:
            public: true
        # the bus in memory: the relay is tested on its own
        Aws\EventBridge\EventBridgeClient:
            arguments:
                - region: '%env(AWS_REGION)%'
                  credentials: '%app.aws_credentials%'
                  handler: '@Tests\App\Double\InMemoryEventBridge'
        Tests\App\Double\InMemoryEventBridge:
            public: true
        # the moment the controllers give the commands: fixed, so that the tests can name it
        clock:
            class: Symfony\Component\Clock\MockClock
            arguments: ['2026-10-15 09:00:00 UTC']
        # the moment the tables count what they forget from (the outbox, the inbox, the terminal facts, the
        # authorizations): fixed, and long after any run, so that MiniStack, forgetting on the real clock, forgets
        # nothing a test reads
        app.commit_clock:
            class: Symfony\Component\Clock\MockClock
            arguments: ['2100-01-01 00:00:00 UTC']
            public: true
        # the tokens come from MiniStack, issued now: checked now, a test may wait for one to expire
        app.token_clock:
            class: Symfony\Component\Clock\MockClock
            public: true

when@prod:
    services:
        App\Shared\StorageAuthentication: '@App\Shared\SigV4StorageAuthentication'
