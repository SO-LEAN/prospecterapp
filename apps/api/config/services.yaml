parameters:
    # the credentials of the AWS SDK: the keys of MiniStack locally, in a Lambda the temporary ones of its role,
    # valid only with their session token
    app.aws_credentials:
        key: '%env(AWS_ACCESS_KEY_ID)%'
        secret: '%env(AWS_SECRET_ACCESS_KEY)%'
        token: '%env(default::AWS_SESSION_TOKEN)%'
    # the table of each context, by the name its sources give it: where the outbox of a commit and the inbox of a
    # subscription are written
    app.context_tables:
        accounts: '%env(DYNAMODB_TABLE_PREFIX)%-accounts'
        booking: '%env(DYNAMODB_TABLE_PREFIX)%-booking'
        campaigns: '%env(DYNAMODB_TABLE_PREFIX)%-campaigns'
        connectors: '%env(DYNAMODB_TABLE_PREFIX)%-connectors'
        personal-data: '%env(DYNAMODB_TABLE_PREFIX)%-personal-data'
        prospecting: '%env(DYNAMODB_TABLE_PREFIX)%-prospecting'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # every command handler of the core is registered on the command bus, through the translation of its
        # refusals, then its unit of work (App\Shared\DependencyInjection\RefusalTranslatingHandlersPass)
        Prospecter\Core\SharedKernel\Application\Handler\CommandHandler:
            tags: [app.command_handler]
        # every query handler of the core is injected through the translation of its refusals, by the name of
        # its intent: QueryHandler $consultOrganization
        Prospecter\Core\SharedKernel\Application\Handler\QueryHandler:
            tags: [app.query_handler]
        # every event handler of the core is a translator, on the event bus as it is, within the decorators of the
        # command that publishes (ADR 0203); a reaction is a policy that config/subscriptions.json names
        # (App\Shared\DependencyInjection\SubscriptionsPass)
        Prospecter\Core\SharedKernel\Application\Handler\EventHandler:
            tags: [app.event_handler]

    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Input/'
            - '../src/*/Resource/'
            - '../src/*/Presenter/'
            - '../src/*/*Presenter.php'
            - '../src/Exchanges/ExchangeParticipants.php'
            - '../src/Connectors/Google/AuthorizationRequest.php'
            - '../src/Dashboard/DashboardResource.php'
            - '../src/Security/User.php'
            - '../src/Kernel.php'
            - '../src/Shared/Persistence/Table.php'
            - '../src/Shared/Persistence/Write.php'

    # Handlers of the core: commands go through the command bus, queries are called by the controllers, the
    # published services by the anticorruption layers of the other contexts (ADR 0045, 0089)
    Prospecter\Core\:
        resource: '../vendor/prospecter/core/src/{Accounts,Booking,Campaigns,Connectors,PersonalData,Prospecting,Reporting}/Application/{*,*/*}/*Handler.php'
        exclude:
            - '../vendor/prospecter/core/src/Reporting/Application/RebuildFigures/RebuildFiguresHandler.php'
            - '../vendor/prospecter/core/src/Campaigns/Application/Tagging/RebuildTags/RebuildTagsHandler.php'
    # its steps commit their own units (ADR 0103): called through App\Reporting\RebuildOfTheFigures, out of the command
    # bus. It waits for the worker's recordings in flight (ADR 0106)
    Prospecter\Core\Reporting\Application\RebuildFigures\RebuildFiguresHandler:
        autoconfigure: false
    # the same for a command that loads the demonstration, the only one to write: it waits for no recording (ADR 0209)
    app.reporting.rebuild_figures_alone:
        class: Prospecter\Core\Reporting\Application\RebuildFigures\RebuildFiguresHandler
        autoconfigure: false
        arguments: { $recordingsInFlight: '@App\Reporting\NoRecordingsInFlight' }
    # app:reporting:rebuild waits for the worker at each attempt; the demonstration's commands count their first attempt
    # alone, and wait for the worker only on a retry after a conflict (ADR 0209)
    App\Reporting\RebuildOfTheFigures:
        arguments:
            $firstAttempt: '@Prospecter\Core\Reporting\Application\RebuildFigures\RebuildFiguresHandler'
            $retry: '@Prospecter\Core\Reporting\Application\RebuildFigures\RebuildFiguresHandler'
    app.reporting.rebuild_of_the_figures_alone:
        class: App\Reporting\RebuildOfTheFigures
        arguments:
            $firstAttempt: '@app.reporting.rebuild_figures_alone'
            $retry: '@Prospecter\Core\Reporting\Application\RebuildFigures\RebuildFiguresHandler'
    App\Demo\DemoFigures:
        arguments: { $rebuild: '@app.reporting.rebuild_of_the_figures_alone' }
    # each fact commits its own unit (ADR 0141): called by app:tags:rebuild, out of the command bus
    Prospecter\Core\Campaigns\Application\Tagging\RebuildTags\RebuildTagsHandler:
        autoconfigure: false

    # Services of the hexagon, injected in its handlers (ADR 0044)
    Prospecter\Core\SharedKernel\Application\Service\FileStore: ~
    Prospecter\Core\SharedKernel\Application\Service\GeoLocalizer: ~
    Prospecter\Core\Prospecting\Domain\Service\EmailUniqueness: ~
    Prospecter\Core\Prospecting\Domain\Service\SiretUniqueness: ~
    Prospecter\Core\Prospecting\Domain\Service\ReferenceUniqueness: ~
    Prospecter\Core\Prospecting\Domain\Service\WebsiteUniqueness: ~
    Prospecter\Core\Prospecting\Domain\Service\DuplicateSuspicion: ~
    Prospecter\Core\Prospecting\Domain\Service\OrphanContacts: ~
    Prospecter\Core\Prospecting\Domain\Service\ContactOrganizations: ~
    Prospecter\Core\Prospecting\Domain\Service\NotedOnce: ~
    Prospecter\Core\PersonalData\Domain\Service\EmailUniqueness: ~
    Prospecter\Core\PersonalData\Domain\Service\ReferenceUniqueness: ~
    Prospecter\Core\PersonalData\Domain\Service\DuplicateSuspicion: ~
    Prospecter\Core\Reporting\Application\FactRecorder: ~
    Prospecter\Core\Reporting\Application\RebuildFigures\SourceFacts: ~
    Prospecter\Core\Connectors\Application\Calendar\CalendarPusher: ~
    Prospecter\Core\Prospecting\Application\Agenda\PublishedHeldExchanges: ~
    Prospecter\Core\Campaigns\Domain\Service\TaggableHolders: ~
    Prospecter\Core\Campaigns\Application\Tagging\FactRecorder: ~
    Prospecter\Core\Campaigns\Application\TagsOfEveryContact: ~
    Prospecter\Core\Campaigns\Application\Campaign\CampaignTargets: ~
    Prospecter\Core\Prospecting\Application\Timeline\CampaignsOfTimeline: ~
    Prospecter\Core\Prospecting\Application\ToDo\PersonsOfToDos: ~
    Prospecter\Core\Prospecting\Application\Agenda\AgendaInterlocutors: ~
    Prospecter\Core\PersonalData\Application\Identification\PersonIdentifier: ~
    Prospecter\Core\Booking\Application\BookingPage\BookingPages: ~
    Prospecter\Core\Booking\Domain\Service\BusyPeriods: ~
    Prospecter\Core\Booking\Domain\Service\LinkAvailability: ~

    # DynamoDB (ADR 0048): MiniStack locally (DYNAMODB_ENDPOINT), AWS in production (DYNAMODB_ENDPOINT empty);
    # one table per bounded context, injected by name in its repositories only (Table $prospectingTable)
    Aws\DynamoDb\DynamoDbClient:
        arguments:
            - region: '%env(AWS_REGION)%'
              endpoint: '%env(default::DYNAMODB_ENDPOINT)%'
              credentials: '%app.aws_credentials%'
    Aws\DynamoDb\Marshaler:
        arguments: [{ nullify_invalid: true }]
    app.table.accounts:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-accounts' }
    app.table.personal_data:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-personal-data' }
    app.table.prospecting:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-prospecting' }
    app.table.reporting:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-reporting' }
    app.table.connectors:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-connectors' }
    app.table.campaigns:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-campaigns' }
    app.table.booking:
        class: App\Shared\Persistence\Table
        arguments: { $name: '%env(DYNAMODB_TABLE_PREFIX)%-booking' }
    App\Shared\Persistence\Table $accountsTable: '@app.table.accounts'
    App\Shared\Persistence\Table $personalDataTable: '@app.table.personal_data'
    App\Shared\Persistence\Table $prospectingTable: '@app.table.prospecting'
    App\Shared\Persistence\Table $reportingTable: '@app.table.reporting'
    App\Shared\Persistence\Table $connectorsTable: '@app.table.connectors'
    App\Shared\Persistence\Table $campaignsTable: '@app.table.campaigns'
    App\Shared\Persistence\Table $bookingTable: '@app.table.booking'

    # The services the contexts offer each other, answered in process by the handlers of their Contracts (ADR 0089)
    Prospecter\Core\Accounts\Contract\Service\ConsultMembers\ConsultMembersService: '@Prospecter\Core\Accounts\Application\Member\ConsultMembers\ConsultMembersHandler'
