# Routes are declared with #[Route] attributes on controllers.
# To list all registered routes, run: bin/console debug:router

statics:
    resource: ../src/Controller/Statics/
    type: attribute
    host: '%app_static_host%'

auth:
    resource: ../src/Controller/Auth/
    type: attribute
    host: '%app_api_host%'

# the JSON API, one folder of controllers per bounded context (ADR 0030)
me:
    resource: ../src/Me/Controller/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

prospecting:
    resource: ../src/Prospecting/Controller/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

dashboard:
    resource: ../src/Dashboard/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }
