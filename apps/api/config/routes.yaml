# Routes are declared with #[Route] attributes on controllers.
# To list all registered routes, run: bin/console debug:router

# the JSON API, one folder of controllers per bounded context (ADR 0030)
me:
    resource: ../src/Me/Controller/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

prospecting:
    resource: ../src/Prospecting/Controller/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

dashboard:
    resource: ../src/Dashboard/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

personal_data:
    resource: ../src/PersonalData/Controller/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

# the contacts across Prospecting and PersonalData, composed like the dashboard
contacts:
    resource: ../src/Contacts/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

# an exchange with a contact read in Prospecting, the members who noted and corrected it named by PersonalData
exchanges:
    resource: ../src/Exchanges/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }

# where and with what the members sign in (Cognito, ADR 0052)
sign_in:
    resource: ../src/SignIn/Controller/
    type: attribute
    host: '%app_api_host%'
    defaults: { _format: json }
