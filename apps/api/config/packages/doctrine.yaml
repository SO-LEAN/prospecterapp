doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Organization:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/Organization'
                prefix: 'Prospecter\Core\Domain\Organization'
            User:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/User'
                prefix: 'Prospecter\Core\Domain\User'
            # authentication, kept apart from the core (future authorization server)
            Auth:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth'
                prefix: 'App\Auth'
                alias: Auth

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
