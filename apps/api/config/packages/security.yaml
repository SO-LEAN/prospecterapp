security:
    # an administrator may do what any member may, the personal data managed included, as the core lets them read them
    role_hierarchy:
        ROLE_ADMIN: [ROLE_PROSPECTOR, ROLE_PERSONAL_DATA, ROLE_USER]

    providers:
        members:
            id: App\Security\MemberProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        api_doc:
            pattern: ^/api/doc
            security: false
        # where to sign in, asked before anyone is
        user_pool:
            pattern: ^/api/user-pool$
            security: false
        # resource server: every API call carries an access token of the Cognito user pool (ADR 0052)
        api:
            pattern: ^/api/
            stateless: true
            provider: members
            access_token:
                token_handler: App\Security\AccessTokenHandler
            entry_point: App\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\Security\ApiAccessDeniedHandler

    access_control:
        - { path: ^/api/, roles: ROLE_USER }
