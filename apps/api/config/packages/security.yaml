security:
    # an administrator may do what any user may
    role_hierarchy:
        ROLE_ADMIN: [ROLE_PROSPECTOR, ROLE_USER]

    providers:
        members:
            id: App\Security\MemberProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        api_doc:
            pattern: ^/api/doc
            security: false
        # resource server: every API call carries an access token of the authorization server (apps/auth)
        api:
            pattern: ^/api/
            stateless: true
            provider: members
            access_token:
                token_handler: App\Security\AccessTokenHandler
            entry_point: App\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\Security\ApiAccessDeniedHandler

    access_control:
        - { path: ^/api/, roles: ROLE_USER }
