security:
    # an administrator may do what any member may, the personal data managed included, as the core lets them read them
    role_hierarchy:
        ROLE_ADMIN: [ROLE_PROSPECTOR, ROLE_PERSONAL_DATA, ROLE_USER]

    providers:
        members:
            id: App\Security\MemberProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        api_doc:
            pattern: ^/api/doc
            security: false
        # where to sign in, asked before anyone is
        user_pool:
            pattern: ^/api/user-pool$
            security: false
        # the page a public link of a booking leads to, read by whomever holds the link (ADR 0151)
        booking_page:
            pattern: ^/api/booking-pages/[^/]+$
            security: false
        # the notifications of Gmail Pub/Sub pushes to an account, with a token Google signed for the account of service
        # of its subscription (ADR 0154)
        gmail_notifications:
            pattern: ^/api/accounts/[^/]+/gmail-notifications$
            stateless: true
            custom_authenticators: [App\Connectors\Google\GmailPushAuthenticator]
        # the MCP server: the access tokens of Cognito, as for the API, those of the AIs too, its callers the members
        # they name (ADR 0156, 0157)
        mcp:
            pattern: ^/mcp$
            stateless: true
            provider: members
            access_token:
                token_handler: app.mcp_token_handler
                failure_handler: App\Security\McpAuthenticationEntryPoint
            entry_point: App\Security\McpAuthenticationEntryPoint
        # resource server: every API call carries an access token of the Cognito user pool (ADR 0052)
        api:
            pattern: ^/api/
            stateless: true
            provider: members
            access_token:
                token_handler: App\Security\AccessTokenHandler
            entry_point: App\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\Security\ApiAccessDeniedHandler

    access_control:
        - { path: ^/api/accounts/[^/]+/gmail-notifications$, roles: ROLE_GMAIL_PUSHER }
        - { path: ^/api/, roles: ROLE_USER }
        - { path: ^/mcp$, roles: ROLE_USER }
