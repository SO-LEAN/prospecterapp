security:
    providers:
        prospecter_provider:
            id: App\Security\ProspecterUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets)/
            security: false
        static:
            host: '%app_static_host%'
            security: false
        main:
            host: '%app_application_host%'
            lazy: true
            provider: prospecter_provider
            custom_authenticators:
                - App\Security\ProspecterAuthenticator
            entry_point: App\Security\ProspecterAuthenticator
            logout:
                path: logout
                target: login

    access_control:
        - { host: '%app_application_host%', path: ^/login, roles: PUBLIC_ACCESS }
        - { host: '%app_application_host%', path: ^/, roles: ROLE_PROSPECTOR }
