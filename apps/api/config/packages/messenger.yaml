framework:
    messenger:
        # No transport: a command is handled synchronously, within the request, so the controller can read
        # the result back with a query right after (ADR 0029).
        default_bus: command.bus
        buses:
            command.bus: ~
            # the domain events a use case releases, delivered within it (ADR 0042, 0043): the other
            # contexts react, the activity journal keeps them all
            event.bus:
                default_middleware:
                    allow_no_handlers: true
