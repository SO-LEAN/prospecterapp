# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # behind the API Gateway of the Lambda (Bref), the request comes in http: the gateway tells it was https
    # (TRUSTED_PROXIES=REMOTE_ADDR in the function, empty for the tests)
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-proto', 'x-forwarded-port']

    serializer:
        default_context:
            # an unknown field is a client mistake (wrong format, typo): reject it with a 422 instead of
            # silently ignoring it, which would let the client believe its change was saved
            allow_extra_attributes: false
            # report each unknown field as a violation on its own path, like the validator does
            collect_extra_attributes_errors: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
