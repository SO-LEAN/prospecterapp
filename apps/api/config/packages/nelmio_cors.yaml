nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Location']
        max_age: 3600
    paths:
        '^/api/': ~

# the front reads the profile of a call; the same headers in docker/lambda/deploy.sh
when@dev:
    nelmio_cors:
        defaults:
            expose_headers: ['Location', 'X-Debug-Token', 'X-Debug-Token-Link']
