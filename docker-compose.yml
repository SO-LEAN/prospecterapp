services:
  php:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # the whole monorepo is mounted: apps/api/vendor links to packages/
    volumes:
      - ./:/var/www/src
      - composer-cache:/home/developer/.cache/composer
    working_dir: /var/www/src/apps/api
    depends_on:
      - ministack
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: pro-php
  node:
    build: docker/node
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/src
      - pnpm-store:/pnpm-store
    command: pnpm dev
    container_name: pro-node
  nginx:
    build: docker/nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      - php
      - node
      - ministack
    volumes:
      - ./:/var/www/src:ro
      - ./docker/data/ssl/certs/:/etc/ssl/certs
    environment:
      NGINX_HOST: local.prospecter.io
      PHP_FPM_HOST: php
      # the API on PHP-FPM, or in its Lambda (make lambda, docker-compose.lambda.yml)
      API_RUNTIME: fpm
      FRONT_HOST: node
      # MiniStack, behind the static host (the bucket of the files, apps/storage/.env) and the API host (Cognito)
      MINISTACK_HOST: ministack:4566
      FILES_BUCKET: prospecter-dev-files
    container_name: pro-nginx

  # the AWS services emulated locally (ADR 0048, 0051): DynamoDB for the API, S3 for the storage,
  # Cognito for the sign-in (ADR 0052), kept between restarts
  ministack:
    image: ministackorg/ministack:1.5.27
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      MINISTACK_REGION: eu-west-3
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      S3_DATA_DIR: /var/lib/ministack/s3
      STATE_DIR: /var/lib/ministack
    volumes:
      - ministack-data:/var/lib/ministack
    container_name: pro-ministack
volumes:
  composer-cache:
  pnpm-store:
  ministack-data:
