services:
  php:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # the whole monorepo is mounted: webapp/vendor links to packages/
    volumes:
      - ./:/var/www/src
      - composer-cache:/home/developer/.cache/composer
    working_dir: /var/www/src/webapp
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: pro-php
  nginx:
    build: docker/nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      - php
    volumes:
      - ./:/var/www/src:ro
      - ./docker/data/ssl/certs/:/etc/ssl/certs
    environment:
      NGINX_HOST: local.prospecter.io
      PHP_FPM_HOST: php
    container_name: pro-nginx

volumes:
  composer-cache:
