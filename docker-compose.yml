services:
  # the command line of the PHP apps (tests, Composer, console): the apps themselves run in their Lambdas
  php:
    image: ${PHP_IMAGE:-prospecter-php:local}
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # the whole monorepo is mounted: apps/api/vendor links to packages/
    volumes:
      - ./:/var/www/src
      - composer-cache:/home/developer/.cache/composer
    working_dir: /var/www/src/apps/api
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [cli]
  node:
    image: ${NODE_IMAGE:-prospecter-node:local}
    build: docker/node
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/src
      - pnpm-store:/pnpm-store
    command: pnpm dev
    environment:
      # the port of the host the browser reaches the stack on (ADR 0116), for the live reload of Vite
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
  # the ports of the host are published by the main checkout only (docker-compose.host.yml, ADR 0116): the stack of
  # a worktree is reached in its Docker network, by its journeys
  nginx:
    image: ${NGINX_IMAGE:-prospecter-nginx:local}
    build: docker/nginx
    depends_on:
      - node
      - ministack
    volumes:
      - ./docker/data/ssl/certs/:/etc/ssl/certs
    environment:
      NGINX_HOST: local.prospecter.io
      # the port its hosts listen on, that of the host the browser reaches (ADR 0116)
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
      FRONT_HOST: node
      # MiniStack, behind the API and static hosts: the HTTP APIs of the Lambdas, the buckets of the files and of the
      # private files (apps/storage/.env) and Cognito
      MINISTACK_HOST: ministack:4566
      FILES_BUCKET: prospecter-dev-files
      PRIVATE_FILES_BUCKET: prospecter-dev-private-files

  # the AWS services emulated locally, kept between restarts: DynamoDB for the API (ADR 0048), S3 for the storage
  # (ADR 0051), Cognito for the sign-in (ADR 0052), and the Lambdas of the API and the storage behind their HTTP
  # APIs (ADR 0055). It runs the functions in containers of the Docker of the host, whose socket it gets: the
  # rights of root on the host, accepted locally. The repository is mounted in the functions as in php.
  ministack:
    image: ministackorg/ministack:1.5.27
    environment:
      MINISTACK_REGION: eu-west-3
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      S3_DATA_DIR: /var/lib/ministack/s3
      STATE_DIR: /var/lib/ministack
      LAMBDA_EXECUTOR: docker
      LAMBDA_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-prospecterapp}_default
      LAMBDA_DOCKER_FLAGS: -v ${PROJECT_DIR:-${PWD}}:/var/www/src
      # the code being mounted, a warm function stays up to date: keep it an hour rather than 5 minutes
      LAMBDA_WARM_TTL_SECONDS: "3600"
      # a burst of reactions starts tens of containers at once, the Docker daemon answering each beyond the 10 s
      # MiniStack waits by default: the invocation of a rule failing to start is lost, only logged
      MINISTACK_DOCKER_TIMEOUT: "120"
    volumes:
      - ministack-data:/var/lib/ministack
      - /var/run/docker.sock:/var/run/docker.sock

  # the AWS services of the tests of the API and the storage (.env.test), one per checkout: neither port nor container
  # name of its own, nor state kept, nor Lambdas, so that the tests never wait for the stack another checkout holds
  ministack-test:
    image: ministackorg/ministack:1.5.27
    environment:
      MINISTACK_REGION: eu-west-3
    # the health check of the image, more often: the tests wait for it
    healthcheck:
      interval: 1s
    profiles: [test]

  # deploys the Lambdas and their HTTP APIs (docker/lambda/deploy.sh, make start)
  lambda-deploy:
    image: ${LAMBDA_DEPLOY_IMAGE:-prospecter-lambda-deploy:local}
    build: docker/lambda
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: eu-west-3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      API_HOST: api.local.prospecter.io
      # in the addresses the functions give the browser (ADR 0116)
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
    # the subscriptions the rules of the worker are made of
    volumes:
      - ./apps/api/config/subscriptions.json:/build/subscriptions.json:ro
    depends_on:
      - ministack
    profiles: [deploy]
volumes:
  # the downloads of Composer and pnpm, shared by the stacks of every checkout (ADR 0116): a new worktree installs its
  # dependencies from them; the data of MiniStack stay those of the stack
  composer-cache:
    name: prospecter-composer-cache
  pnpm-store:
    name: prospecter-pnpm-store
  ministack-data:
