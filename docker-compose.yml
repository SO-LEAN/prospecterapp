services:
  php:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # the whole monorepo is mounted: apps/api/vendor links to packages/
    volumes:
      - ./:/var/www/src
      - composer-cache:/home/developer/.cache/composer
    working_dir: /var/www/src/apps/api
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: pro-php
  node:
    build: docker/node
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/src
      - pnpm-store:/pnpm-store
    command: pnpm dev
    container_name: pro-node
  nginx:
    build: docker/nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      - php
      - node
    volumes:
      - ./:/var/www/src:ro
      - ./docker/data/ssl/certs/:/etc/ssl/certs
    environment:
      NGINX_HOST: local.prospecter.io
      PHP_FPM_HOST: php
      FRONT_HOST: node
    container_name: pro-nginx

volumes:
  composer-cache:
  pnpm-store:
